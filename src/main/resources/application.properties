# AI-Powered IT Helpdesk & Support Ticket Management System Configuration

# Server Port
server.port=8080

# Database Configuration (MySQL)
db.url=jdbc:mysql://localhost:3306/ai_helpdesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# In-Memory H2 DB fallback for local tests and offline dev without MySQL setup
# db.url=jdbc:h2:mem:ai_helpdesk;MODE=MySQL;DB_CLOSE_DELAY=-1

# AI LLM API Configuration (Groq API)
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# GROQ API KEY:
# Option A: Paste your Groq API key below:
# groq.api.key=gsk_your_groq_api_key_here
groq.api.key=

# Option B: Set the environment variable: GROQ_API_KEY
# If left blank, the system automatically uses an intelligent local diagnosis engine!

# Security & Session Settings
session.timeout.minutes=60
