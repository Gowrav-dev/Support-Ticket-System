<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI IT Helpdesk</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <div class="nav-header">
    <div class="brand">🤖 AI IT Helpdesk</div>
    <div class="nav-links">
      <a href="/index.html">User Portal</a>
      <a href="/login.html" class="active">Login</a>
      <a href="/register.html">Register</a>
    </div>
  </div>

  <div class="container" style="max-width: 460px; margin-top: 50px;">
    <div class="card">
      <h2 style="margin-bottom: 6px; text-align: center;">Sign In</h2>
      <p style="color: #64748b; font-size: 0.9rem; text-align: center; margin-bottom: 24px;">
        Access your helpdesk account (User or Support Staff)
      </p>

      <div id="error-alert" style="display: none; background: #fee2e2; border: 1px solid #f87171; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 16px;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="Enter username" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 6px;">
          Log In
        </button>
      </form>

      <div style="text-align: center; margin-top: 18px; font-size: 0.9rem;">
        Don't have an account? <a href="/register.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">Create an account</a>
      </div>

      <!-- Quick Demo Login Buttons for Interviews / Testing -->
      <div class="quick-demo-box">
        <h4>⚡ Quick Demo Logins (1-Click)</h4>
        <div class="quick-demo-buttons" style="flex-direction: column; gap: 8px;">
          <button type="button" onclick="demoLogin('john_doe', 'Password@123')" class="btn btn-secondary btn-sm" style="text-align: left; width: 100%;">
            👤 <strong>John Doe</strong> <span style="color: #64748b;">(Regular User)</span>
          </button>
          <button type="button" onclick="demoLogin('alex_support', 'Password@123')" class="btn btn-secondary btn-sm" style="text-align: left; width: 100%;">
            🛠️ <strong>Alex Rivera</strong> <span style="color: #2563eb; font-weight: 600;">(Support Staff #1)</span>
          </button>
          <button type="button" onclick="demoLogin('sarah_support', 'Password@123')" class="btn btn-secondary btn-sm" style="text-align: left; width: 100%;">
            🛠️ <strong>Sarah Chen</strong> <span style="color: #059669; font-weight: 600;">(Support Staff #2)</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    async function doLogin(username, password) {
      const errBox = document.getElementById('error-alert');
      const btn = document.getElementById('login-btn');
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          const auth = data.data;
          localStorage.setItem('auth_token', auth.token);
          localStorage.setItem('user_name', auth.user.username);
          localStorage.setItem('full_name', auth.user.fullName);
          localStorage.setItem('user_role', auth.user.role);

          if (auth.user.role === 'SUPPORT_STAFF') {
            window.location.href = '/support.html';
          } else {
            window.location.href = '/index.html';
          }
        } else {
          errBox.textContent = data.error || 'Login failed. Please check credentials.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Log In';
        }
      } catch (e) {
        errBox.textContent = 'Server connection error. Make sure the Java backend is running.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      doLogin(u, p);
    });

    function demoLogin(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      doLogin(u, p);
    }
  </script>
</body>
</html>
